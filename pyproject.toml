[project]
name = "fun-with-pretraining"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul-Elliot", email = "peada@free.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
fun-with-pretraining = "fun_with_pretraining:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
